name: Update publications

# Weekly sync of _bibliography/papers.bib and _data/metrics.yml from ORCID + OpenAlex.
# New papers get a news item; the site is then rebuilt by dispatching deploy.yml
# (pushes made with GITHUB_TOKEN do not trigger other workflows on their own).

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC (09:17 WIB)
  workflow_dispatch:

permissions:
  contents: write # commit the updated bibliography
  actions: write # start the deploy workflow

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch publications and metrics
        run: python bin/update_publications.py
      - name: Commit changes and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard _news _bibliography _data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib _data/metrics.yml _news
          git commit -m "Update publications and metrics from ORCID/OpenAlex"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
