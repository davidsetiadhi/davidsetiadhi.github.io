name: Deploy site

# Builds the Astro site and publishes dist/ to the gh-pages branch (same branch GitHub Pages
# already serves). update-publications.yml dispatches this workflow after a weekly sync.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/workflows/update-publications.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Build CV PDF
        run: |
          pip install -r requirements.txt
          python bin/build_cv.py
      - name: Install and build
        env:
          # Set the repository variable SITE_URL (e.g. https://davestia.com) when the custom domain goes live.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm ci
          npm run build
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
