name: Deploy site

# Builds the Astro site and publishes dist/ to the gh-pages branch (same branch GitHub Pages
# already serves). update-publications.yml dispatches this workflow after a weekly sync.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/workflows/update-publications.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Build CV PDF
        run: |
          pip install -r requirements.txt
          python bin/build_cv.py
      - name: Install and build
        env:
          # Set the repository variable SITE_URL (e.g. https://davestia.com) when the custom domain goes live.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm ci
          npm run build
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
