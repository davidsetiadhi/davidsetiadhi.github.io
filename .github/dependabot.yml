# Weekly dependency updates. Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
# version comment together. Minor and patch updates are grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      pip-minor:
        update-types: [minor, patch]
