# Single source for the CV.
#  - The /cv/ page renders this file directly (al_folio_cv, cv_format: rendercv).
#  - bin/build_cv.py turns it into the downloadable PDF with RenderCV. It adds the
#    email address from _data/contact.yml and the publication list from
#    _bibliography/papers.bib, so neither needs to be repeated here.
# Edit this file and push: the deploy workflow rebuilds both the page and the PDF.
# Format reference: https://docs.rendercv.com/user_guide/yaml_input_structure/cv/

# Opening paragraph of the PDF (the website shows the About page instead).
profile: >-
  I am a mechanical engineer and PhD candidate at Bursa Uludağ University (defense expected December 2026). My doctoral work models gas-phase ozone transport in a closed recirculating sterilization chamber for reusable medical devices, using a mathematical model, ANSYS Fluent simulation, and an experimental setup I built and instrumented. Since March 2023 I have also worked in industrial R&D, designing and validating precision fixtures and mechanisms for automotive clients such as Bosch, Tesla, Odelo, and OPmobility. Before that I spent seven years in research assistance, laboratory management, and teaching support at Universitas Muhammadiyah Surakarta.

